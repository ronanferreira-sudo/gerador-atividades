{% extends 'base.html' %}

{% block conteudo %}

<div class="container mt-4">

    <h2>Planos de Aula</h2>

    <table class="table table-bordered">

        <thead>

            <tr>
                <th>Dia</th>
                <th>Tema</th>
                <th>Ações</th>
            </tr>

        </thead>

        <tbody>

            {% for plano in planos %}

            <tr>

                <td>
                    <strong>Dia {{ plano[2] }}</strong><br>
                    <pre style="white-space: pre-wrap;">{{ plano[3] }}</pre>
                </td>

                <td>{{ plano[3] }}</td>

                <td>

                    <a href="/plano/{{ plano[0] }}" class="btn btn-success btn-sm">
                        Visualizar
                    </a>

                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
