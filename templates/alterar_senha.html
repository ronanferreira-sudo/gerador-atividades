{% extends 'base.html' %}

{% block titulo %}Alterar Minha Senha &mdash; SENAI{% endblock %}

{% block conteudo %}

<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">

        <div class="card-modern shadow-md">
            <div class="card-header-modern bg-white d-flex align-items-center gap-3 py-3">
                <div class="brand-icon-wrapper" style="width: 44px; height: 44px; font-size: 1.3rem;">
                    <i class="bi bi-key-fill"></i>
                </div>
                <div>
                    <h4 class="mb-0 fw-bold">Alterar Minha Senha</h4>
                    <span class="text-muted small">Atualize sua senha de acesso ao sistema</span>
                </div>
            </div>

            <div class="card-body p-4 p-md-5">

                {% if erro %}
                <div class="alert alert-danger py-2 px-3 mb-4 d-flex align-items-center gap-2 small rounded-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-5"></i>
                    <div>{{ erro }}</div>
                </div>
                {% endif %}

                {% if sucesso %}
                <div class="alert alert-success py-2 px-3 mb-4 d-flex align-items-center gap-2 small rounded-3" role="alert">
                    <i class="bi bi-check-circle-fill fs-5"></i>
                    <div>{{ sucesso }}</div>
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-shield-lock text-primary"></i> Senha Atual <span class="text-danger">*</span>
                        </label>
                        <input type="password" name="senha_atual" class="form-control form-control-lg"
                               placeholder="Digite sua senha atual" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            <i class="bi bi-lock text-primary"></i> Nova Senha <span class="text-danger">*</span>
                        </label>
                        <input type="password" name="nova_senha" class="form-control form-control-lg"
                               placeholder="Mínimo 3 caracteres" minlength="3" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            <i class="bi bi-lock-fill text-primary"></i> Confirmar Nova Senha <span class="text-danger">*</span>
                        </label>
                        <input type="password" name="confirmar_senha" class="form-control form-control-lg"
                               placeholder="Repita a nova senha" minlength="3" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-lg flex-grow-1 fw-bold shadow-sm">
                            <i class="bi bi-check-lg"></i> Atualizar Senha
                        </button>
                        <a href="/dashboard" class="btn btn-outline-secondary btn-lg">
                            Cancelar
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
