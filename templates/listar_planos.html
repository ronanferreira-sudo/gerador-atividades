<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Planos de Aula</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    {% include 'menu.html' %}

    <div class="container mt-4">

        <h2>Planos de Aula Gerados</h2>

        <table class="table table-striped">

            <thead>

                <tr>

                 
                    <th>Curso</th>
                    <th>Carga Horária</th>
                    <th>Aulas/Dia</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody>

                {% for plano in planos %}

                <tr>
                  
                    <td>{{ plano[1] }}</td>

                    <td>{{ plano[2] }}h</td>

                    <td>{{ plano[3] }}</td>

                    <td>

                        <a href="/visualizar_plano/{{ plano[0] }}" class="btn btn-primary btn-sm">
                            Ver
                        </a>

                        <a href="/editar_plano/{{ plano[0] }}" class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <a href="/excluir_plano/{{ plano[0] }}" class="btn btn-danger btn-sm">
                            Excluir
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</body>

</html>
