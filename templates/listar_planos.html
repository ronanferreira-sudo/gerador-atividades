<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Planos de Aula</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    {% include 'menu.html' %}

    <div class="container-fluid mt-4">

        <h1 class="text-center mb-4">
            Planos de Aula Gerados
        </h1>

        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>Curso</th>
                        <th>Carga Horária</th>
                        <th>Aulas/Dia</th>
                        <th></th>

                    </tr>

                </thead>

                <tbody>

                    {% for plano in planos %}

                    <tr>

                        <td>{{ plano[1] }}</td>

                        <td>{{ plano[2] }}h</td>

                        <td>{{ plano[3] }}</td>

                        <td class="acoes">

                            <a href="/plano/{{ plano[0] }}" class="btn btn-success btn-sm">
                                Visualizar
                            </a>

                            <a class="btn btn-warning btn-sm" href="/editar_plano/{{ plano[1] }}">
                                Editar
                            </a>

                            <a class="btn btn-danger btn-sm" href="/excluir_plano/{{ plano[0] }}"
                                onclick="return confirm('Deseja excluir este plano?')">
                                Excluir
                            </a>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
