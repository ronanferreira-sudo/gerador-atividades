{% extends 'base.html' %}

{% block titulo %}Importar Plano de Curso{% endblock %}

{% block conteudo %}

<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">

        <div class="card shadow border-0">
            <div class="card-body p-4">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Importar Plano de Curso</h2>
                    <p class="text-muted">Faca upload do PDF do plano de curso para gerar os planos de aula automaticamente</p>
                </div>

                <form method="POST" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome do Curso</label>
                        <input type="text" name="nome_curso" class="form-control form-control-lg"
                               placeholder="Ex: Informatica Basica" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Carga Horaria Total</label>
                            <input type="number" name="carga_horaria" class="form-control form-control-lg"
                                   placeholder="Ex: 60" min="1" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Aulas por Dia</label>
                            <input type="number" name="aulas_por_dia" class="form-control form-control-lg"
                                   placeholder="Ex: 4" min="1" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">PDF do Plano de Curso</label>
                        <input type="file" name="arquivo_pdf" class="form-control form-control-lg"
                               accept=".pdf" required>
                        <div class="form-text">Envie o PDF com a ementa/conteudo programatico do curso</div>
                    </div>

                    <button class="btn btn-primary btn-lg w-100 fw-bold">
                        Ler PDF e Gerar Planos
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
