{% extends 'base.html' %}

{% block titulo %}Dashboard{% endblock %}

{% block conteudo %}

<div class="container-fluid py-4">

    <h2 class="mb-4 text-center">Dashboard - Atividades por Curso</h2>

    <div class="row g-4 justify-content-center">

        {% for curso in cursos %}

        <div class="col-12 col-sm-6 col-md-4 col-lg-3">

            <a href="/atividades?busca={{ curso[0] }}" class="text-decoration-none">
                <div class="card text-white text-center shadow-sm h-100
                    {% if loop.index % 5 == 1 %}bg-primary{% endif %}
                    {% if loop.index % 5 == 2 %}bg-success{% endif %}
                    {% if loop.index % 5 == 3 %}bg-warning text-dark{% endif %}
                    {% if loop.index % 5 == 4 %}bg-info text-dark{% endif %}
                    {% if loop.index % 5 == 0 %}bg-danger{% endif %}
                ">
                    <div class="card-body d-flex flex-column justify-content-center py-4 card-link-hover">
                        <h5 class="card-title fw-bold text-truncate">{{ curso[0] }}</h5>
                        <p class="display-3 fw-bold my-2">{{ curso[1] }}</p>
                        <small class="opacity-75">clique para ver atividades</small>
                    </div>
                </div>
            </a>

        </div>

        {% else %}

        <div class="col-12">
            <div class="alert alert-info text-center">
                Nenhuma atividade cadastrada ainda.
            </div>
        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
